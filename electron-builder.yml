appId: com.imagequeue.app
productName: ImageQueue
copyright: Copyright © 2026 Yoshinao Inoguchi

# No `publish` block: electron-builder always runs with `--publish never`. The
# release workflow (release.yml) attaches the installer + portable zip per OS to a
# draft GitHub Release via softprops/action-gh-release, whose globs omit
# electron-builder's auto-update byproducts (latest*.yml, *.blockmap, the mac
# update metadata), so those are never uploaded. Add a `publish` block +
# electron-updater if/when you want in-app auto-updates.

directories:
  buildResources: build
  output: dist

# electron-vite emits the app into out/; electron-builder also auto-includes
# production dependencies from package.json (node-pty, openai, @google/genai, …).
files:
  - 'out/**'
  - 'package.json'
  # No runtime path consumes source maps or TypeScript declarations. Excluding
  # them keeps provider SDK development metadata out of the reviewed artifact.
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.mts'
  - '!**/*.d.cts'
  # node-pty's npm tarball includes build scripts, TypeScript sources, tests,
  # source maps, winpty sources, and typings. Runtime needs only package.json,
  # LICENSE, compiled lib/*.js, and prebuilds; keep development material out of
  # both app.asar and its unpacked companion.
  - '!**/node_modules/node-pty/binding.gyp'
  - '!**/node_modules/node-pty/{deps,scripts,src,third_party,typings}/**'
  - '!**/node_modules/node-pty/lib/**/*.test.js'

# node-pty is N-API based (node-addon-api) and ships prebuilt binaries for
# darwin-{arm64,x64} and win32-{arm64,x64}. N-API is ABI-stable across Node and
# Electron, so those prebuilds load under Electron as-is — do NOT recompile them
# (source build needs a toolchain we don't want CI to depend on).
npmRebuild: false

# node-pty ships a native addon (pty.node) and a plain executable (spawn-helper).
# The .node is unpacked automatically, but spawn-helper must also be outside the
# asar. Both live under prebuilds; compiled JavaScript remains in app.asar.
asarUnpack:
  - '**/node_modules/node-pty/prebuilds/**'
  - '**/node_modules/@koromix/koffi-*/**/*'

# Tahoe "Liquid Glass" icon: ship the pre-compiled asset catalog (committed in
# company/assets, deployed here by the liquid-glass-icon tool) into Contents/Resources.
# macOS 26 reads CFBundleIconName below → this catalog; older macOS falls back to
# CFBundleIconFile → build/icon.icns (mac.icon). Building does NOT need Xcode — the
# Assets.car is prebuilt; only re-generating the icon does.
extraResources:
  - from: node_modules/koffi/LICENSE.txt
    to: koffi/LICENSE.txt
  - from: node_modules/koffi/vendor/node-addon-api/LICENSE.md
    to: koffi/node-addon-api-LICENSE.md
  - from: node_modules/koffi/vendor/node-api-headers/LICENSE
    to: koffi/node-api-headers-LICENSE
  - from: build/Assets.car
    to: Assets.car
  - from: LICENSE
    to: LICENSE.txt
  - from: node_modules/electron/dist/LICENSE
    to: electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: electron/LICENSES.chromium.html
  # Native status icons keep stable filenames so macOS recognizes the Template
  # + @2x pair and the main process can swap explicit Windows contrast variants.
  - from: build/status-icons
    to: status-icons

mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  extendInfo:
    CFBundleIconName: image-grid-charcoal
  # Pin arm64 explicitly so the macOS artifact's architecture is deterministic,
  # not inherited from whatever the build host/runner happens to be.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # No Apple Developer certificate available. `identity: "-"` ad-hoc-signs the whole
  # bundle — a valid seal that launches cleanly, unlike identity:null which skips
  # bundle signing and leaves the seal broken. CSC_IDENTITY_AUTO_DISCOVERY=false (CI)
  # only blocks real-cert discovery; the "-" identity is what produces the seal.
  # macOS still shows "unidentified developer" until a Developer ID cert +
  # notarization are added via CI secrets.
  identity: "-"
  notarize: false

win:
  icon: build/icon.ico
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}

dmg:
  artifactName: ${name}-${version}.${ext}
